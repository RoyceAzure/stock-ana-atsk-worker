apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "promtail.fullname" . }}-config
  labels:
    {{- include "promtail.labels" . | nindent 4 }}
data:
  promtail.yaml: |
    server:
      log_level: info
      http_listen_port: 3101
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: {{ .Values.loki.url | quote }}
        {{- if .Values.extraLabels }}
        external_labels:
          {{- toYaml .Values.extraLabels | nindent 10 }}
        {{- end }}

    scrape_configs:
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
          - match:
              selector: '{app=~"{{ include "promtail.jsonAppSelector" . }}"}'
              stages:
                - json:
                    expressions:
                      timestamp: timestamp
                      level: level
                      logger: name
                      message: message
                      app: app
                      task_event_id: task_event_id
                - labels:
                    {{- range .Values.pipeline.labelFields }}
                    {{ . }}:
                    {{- end }}
                - output:
                    source: message
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - action: drop
            source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed|Unknown
          {{- range .Values.scrapeNamespaces }}
          - action: keep
            source_labels: [__meta_kubernetes_namespace]
            regex: {{ . | quote }}
          {{- end }}
          - action: replace
            source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - action: replace
            source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - action: replace
            source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - action: replace
            source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - action: replace
            source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - action: replace
            replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
