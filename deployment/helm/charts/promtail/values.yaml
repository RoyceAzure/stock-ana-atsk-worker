image:
  repository: grafana/promtail
  tag: "3.0.0"
  pullPolicy: IfNotPresent

imagePullSecretName: ""

# Loki push endpoint（部署 Loki 後請對齊實際 Service）
loki:
  url: http://loki.sexy-stock.svc.cluster.local:3100/loki/api/v1/push

# 僅收集指定 namespace；留空表示全 cluster
scrapeNamespaces:
  - sexy-stock

# 額外靜態 Loki labels（低基數）
extraLabels:
  cluster: kind-lab

server:
  # false：node 上暫無可收集的 pod 時，/ready 仍回 healthy（避免 control-plane 一直 0/1）
  healthCheckTarget: false

# 排除 control-plane node（kind worker 沒有 node-role.kubernetes.io/worker 標籤，不能用該 selector）
excludeControlPlane: true

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

# JSON pipeline：對齊 core/logger/logger.py 的 JsonFormatter 欄位
# 輸出欄位：timestamp, level, name, message, app, task_event_id(optional)
pipeline:
  jsonApps:
    - task-worker
  # 提升為 Loki label 的欄位（避免高基數欄位如 task_event_id）
  labelFields:
    - level
    - app

tolerations: []
