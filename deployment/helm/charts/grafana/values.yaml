image:
  repository: grafana/grafana
  tag: "11.0.0"
  pullPolicy: IfNotPresent

imagePullSecretName: ""

# Service 名稱建議固定為 grafana
fullnameOverride: grafana

service:
  port: 3000

admin:
  user: admin
  # 本機 dev 預設；正式環境請用 .env GRAFANA_ADMIN_PASSWORD 覆寫
  password: admin

# 對齊 loki chart 的 fullnameOverride=loki
loki:
  serviceName: loki
  port: 3100

# 對齊 metrics chart 的 prometheus.fullnameOverride=prometheus
# 未裝 metrics release 時可設 enabled: false
prometheus:
  enabled: true
  serviceName: prometheus
  port: 9090

# 預設 metrics dashboard（需 prometheus.enabled=true）
dashboards:
  enabled: true
  # 留空則使用 release namespace
  defaultNamespace: ""
  # Backtest Worker dashboard（PromQL 監控 task-worker Pod）
  worker:
    enabled: true
    # 留空則預設 .*-worker-.*；建議設為 {K8S_RELEASE_NAME}-worker.*
    podRegex: ""

resources:
  limits:
    cpu: 300m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# 常駐 node（kind: make limit-workers；GKE: 對應常駐 node pool label）
nodeSelector:
  node-type: resident
