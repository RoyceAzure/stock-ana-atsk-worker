{{- if .Values.kubeStateMetrics.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "metrics.kubeStateMetrics.fullname" . }}
  labels:
    {{- include "metrics.kubeStateMetrics.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - nodes
      - pods
      - services
      - serviceaccounts
      - resourcequotas
      - replicationcontrollers
      - limitranges
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
      - endpoints
    verbs: [list, watch]
  - apiGroups: [apps]
    resources:
      - statefulsets
      - daemonsets
      - deployments
      - replicasets
    verbs: [list, watch]
  - apiGroups: [batch]
    resources:
      - cronjobs
      - jobs
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources:
      - horizontalpodautoscalers
    verbs: [list, watch]
  - apiGroups: [policy]
    resources:
      - poddisruptionbudgets
    verbs: [list, watch]
  - apiGroups: [storage.k8s.io]
    resources:
      - storageclasses
      - volumeattachments
    verbs: [list, watch]
  - apiGroups: [coordination.k8s.io]
    resources:
      - leases
    verbs: [list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "metrics.kubeStateMetrics.fullname" . }}
  labels:
    {{- include "metrics.kubeStateMetrics.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "metrics.kubeStateMetrics.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "metrics.kubeStateMetrics.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
