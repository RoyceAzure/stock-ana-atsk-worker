apiVersion: v1
kind: Service
metadata:
  name: {{ include "metrics.prometheus.fullname" . }}
  labels:
    {{- include "metrics.prometheus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.prometheus.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "metrics.prometheus.selectorLabels" . | nindent 4 }}
